services:
  # ============================================
  # Postgres (Self-hosted application database)
  # Replaces the hosted Supabase project, whose host no longer resolves.
  # ============================================
  db:
    # Pinned to a major version on purpose. `latest` would let a rebuild move
    # the server major underneath an existing data volume, which Postgres
    # refuses to start against.
    image: postgres:16-alpine
    container_name: nlp_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nlp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nlp_local_dev}"
      POSTGRES_DB: "${POSTGRES_DB:-nlp}"
      # Consumed by db/init/01-roles.sh to create the PostgREST login role.
      AUTHENTICATOR_PASSWORD: "${AUTHENTICATOR_PASSWORD:-authenticator_local_dev}"
    volumes:
      # Named volume, NOT a bind mount into the repo: data must survive
      # `docker compose down` and must never end up staged in git.
      - pg_data:/var/lib/postgresql/data
      # Init scripts run once, only when the data directory is empty, in
      # alphabetical order. 01 creates roles, 02 is the repo's schema.sql
      # mounted in place (mounted rather than copied so there is exactly one
      # authoritative schema file), 03 grants on the tables 02 created.
      - ./db/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/init/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    ports:
      # Loopback only. The auth model (see db/init/01-roles.sh) assumes this
      # port is not reachable from the network.
      #
      # 3025 on the host, not 5432. This machine already has TWO postgres
      # servers on the usual ports: an unrelated Docker project
      # (NaveeraTech/naveera-api) publishes postgres:16 on 5432, and a native
      # host Postgres listens on 5433. Two listeners cannot share a host port, so
      # `up -d` fails outright with "address already in use" rather than
      # degrading.
      #
      # Diagnosing this needs a real bind test, not `lsof`: plain `lsof -iTCP`
      # run as your own user does NOT show the 5433 server (it belongs to another
      # user) and reports the port free. `netstat -an | grep 5433` and a
      # throwaway `socket.bind()` both show it correctly.
      #
      # Nothing inside this stack is affected: postgrest reaches the database as
      # `db:5432` over the compose network and never touches the published port.
      # Host-side tools do, so connect with `psql -h 127.0.0.1 -p 3025`. The
      # container-side 5432 must stay as it is — that is the port Postgres
      # actually listens on.
      - "127.0.0.1:3025:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlp} -d ${POSTGRES_DB:-nlp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # PostgREST (REST interface the app already speaks)
  # nlp_pillars/db.py is a hand-written PostgREST client, so this needs no
  # application code change — only the URL changes.
  # ============================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: nlp_postgrest
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator_local_dev}@db:5432/${POSTGRES_DB:-nlp}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_SERVER_PORT: "3000"
      # A JWT secret IS required here, and this was verified the hard way.
      # Both database clients send `Authorization: Bearer <SUPABASE_KEY>` on
      # every request and neither can be told not to (nlp_pillars/db.py's
      # get_client() raises if SUPABASE_KEY is empty, and PostgRESTClient sets
      # the header unconditionally). With no secret configured, PostgREST does
      # NOT ignore that token — it fails the whole request with
      # HTTP 500 PGRST300 "Server lacks JWT secret".
      #
      # So the stack supplies a secret, and hands the app a matching token
      # (LOCAL_API_TOKEN on the webui service below) whose only claim is
      # role=web_anon. Loopback-only single-user tool, so the default below is
      # a committed placeholder, exactly like POSTGRES_PASSWORD. Override both
      # it and LOCAL_API_TOKEN in .env if this is ever exposed beyond
      # localhost — they must be changed together, since the token is signed
      # with this secret.
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:-nlp-local-dev-jwt-secret-change-me-please-32}"
    ports:
      - "127.0.0.1:3021:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Qdrant Vector Database (Local) — always on
  #
  # Search and the local projection read this server. Qdrant Cloud is a
  # second, optional copy (QDRANT_CLOUD_URL), not this service.
  #
  # Image pin, determined 2026-10-24: the pinned client is qdrant-client
  # 1.19.0 (requirements.txt). Qdrant asks that the client stay within one
  # minor of the server. The Cloud management API for this account returned
  # a cluster list with totalSize 0 (no cluster left to copy a version
  # from), and the data-plane URL reset the connection instead of answering
  # with a JSON version banner. v1.19.0 of the server shipped 2026-08-04,
  # which is the minor a cluster created in the 2026-08 window would have
  # started on. v1.19.2 (2026-10-05) is the latest patch on that minor.
  # v1.20.0 (2026-10-22) is what Cloud offers for a brand-new cluster and is
  # one minor ahead of the pinned client, so local stays on 1.19. Tag:
  # qdrant/qdrant:v1.19.2
  #
  # The image has bash and no curl/wget. /readyz answers 200 once shards
  # are ready. Do not float this tag: `latest` moved to 1.20 within days
  # of this pin.
  # ============================================
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: nlp_qdrant
    ports:
      # Loopback only, like db/postgrest/webui: Qdrant runs without an API key.
      - "127.0.0.1:3023:6333"
      - "127.0.0.1:3024:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ============================================
  # SearXNG Search Engine (Local)
  # ============================================
  searxng:
    image: searxng/searxng:latest
    container_name: nlp_searxng
    ports:
      - "127.0.0.1:3022:8080"
    volumes:
      - ./searxng_config:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:3022/
      - SEARXNG_SECRET=nlp-workflow-secret-key
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
    restart: unless-stopped

  # ============================================
  # NLP Workflow WebUI (FastAPI)
  # Reads and writes through the self-hosted postgrest service above.
  # ============================================
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_webui
    ports:
      # Loopback only. The only way in from outside this machine is the
      # Cloudflare Tunnel (docs/remote-access.md), which dials 127.0.0.1:3020.
      # Publishing on 0.0.0.0 would let anyone on the LAN skip Cloudflare Access.
      - "127.0.0.1:3020:8000"
    env_file:
      - .env
    environment:
      # Overrides for Docker networking. Values set here beat anything in the
      # env_file above, which matters for POSTGREST_URL in particular.
      #
      # QDRANT: the app reads the local server. Cloud is optional
      # (QDRANT_CLOUD_URL / QDRANT_CLOUD_API_KEY). A suspended cloud cluster
      # does not fail like a dead host: DNS still resolves and every path
      # answers plain-text `404 page not found`. A live server answers `/`
      # with a JSON banner. The projector treats that 404 as "this target
      # stays behind" and retries on the next sync. It does not fail the run.
      #
      # Local Qdrant, hardcoded so a leftover cloud URL in .env cannot point
      # the container at Cloud. `environment:` beats `env_file:`. Both webui
      # and scheduler use this same value; they share the local collection.
      # The cloud copy is optional and read only by the projector.
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: ""
      QDRANT_CLOUD_URL: "${QDRANT_CLOUD_URL:-}"
      QDRANT_CLOUD_API_KEY: "${QDRANT_CLOUD_API_KEY:-}"
      # Every generation stage runs on Claude, so this key is load-bearing:
      # without it the summarizer, the lesson, the quiz and discovery all
      # fail. Required, like the DeepSeek key below.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env — generation runs on Claude}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env — DeepSeek Ground Pack extraction}"
      # Fact-check a saved script on its own run. A failed check does not fail
      # the script run and does not change the script. Unset means on.
      FACTCHECK_AUTO_DISPATCH: ${FACTCHECK_AUTO_DISPATCH:-true}
      # Local embedding weights (pinned BAAI/bge-base-en-v1.5 ONNX, about 208 MB
      # on first use). On the uploads volume so a restart or image rebuild does
      # not fetch them again and the image does not carry the weights.
      # Query and stored vectors use the same provider. Default is the pinned
      # local bge model. EMBEDDING_PROVIDER=openai stores OpenAI vectors in
      # Postgres and projects those; it does not embed inside the projector.
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-local}"
      EMBEDDING_CACHE_DIR: /app/data/embedding-models
      # faster-whisper base.en (about 145 MB, pinned) that times each word of a
      # recorded episode for read-along. Same reasoning: on the uploads volume.
      ALIGNER_CACHE_DIR: /app/data/aligner-models
      #
      # The three database variables below ARE overridden, and all three are
      # needed. Nothing is deleted from .env — these only shadow it for this
      # container, so SUPABASE_URL / SUPABASE_KEY stay on disk and the old
      # project remains reachable if its data is ever recovered.
      #
      # There are TWO database clients and they resolve the URL differently:
      #   - webui/services/postgrest_client.py:54 reads
      #     POSTGREST_URL -> SUPABASE_URL -> http://localhost:3021
      #   - nlp_pillars/db.py's get_client() reads SUPABASE_URL ONLY. It has
      #     no POSTGREST_URL fallback, and it is the client behind
      #     /api/pillars/ and the rest of the pipeline.
      # So POSTGREST_URL alone is NOT sufficient — SUPABASE_URL must be
      # overridden too, or half the app keeps dialling the dead host. (.env
      # still contains stale values for both.)
      #
      # SUPABASE_KEY is overridden because it is sent as an
      # `Authorization: Bearer` token on every request and cannot be disabled:
      # get_client() raises outright if it is empty. The stale Supabase JWT
      # cannot be verified by this PostgREST, so a locally-signed web_anon
      # token replaces it. See PGRST_JWT_SECRET on the postgrest service.
      SEARXNG_URL: "http://searxng:8080"
      POSTGREST_URL: "http://postgrest:3000"
      SUPABASE_URL: "http://postgrest:3000"
      SUPABASE_KEY: "${LOCAL_API_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoid2ViX2Fub24ifQ.jZ5fef9pol5Rqbrl64ZhHMvvAKmT91b_ZtsOYLyEbxM}"
      # IndexTTS runs on the host GPU — never started from the container.
      # host.docker.internal reaches the captain's machine from inside Docker.
      INDEXTTS_URL: "${INDEXTTS_URL:-http://host.docker.internal:3026}"
      INDEXTTS_START_COMMAND: "${INDEXTTS_START_COMMAND:-cd /home/gabo/index-tts && uv run webui.py --host 0.0.0.0 --port 3026}"
      # Cloud reader publishing (see cloud/reader/README.md). Off unless
      # CLOUD_PUBLISH_ENABLED=true. The
      # service token can reach /ingest and nothing else. The bundle directory
      # holds the transcoded audio between runs, on the uploads volume.
      CLOUD_PUBLISH_ENABLED: "${CLOUD_PUBLISH_ENABLED:-false}"
      CLOUD_PUBLISH_URL: "${CLOUD_PUBLISH_URL:-}"
      CF_ACCESS_CLIENT_ID: "${CF_ACCESS_CLIENT_ID:-}"
      CF_ACCESS_CLIENT_SECRET: "${CF_ACCESS_CLIENT_SECRET:-}"
      CLOUD_PUBLISH_MAX_BYTES: "${CLOUD_PUBLISH_MAX_BYTES:-5000000000}"
      CLOUD_BUNDLE_DIR: "/app/data/cloud-bundle"
      VOICES_DIR: "/voices"
      PODCAST_AUDIO_DIR: "/podcasts"
      PODCAST_AUDIO_LEGACY_DIR: "/legacy-data/podcast_audio"
      TTS_DOWNLOAD_DIR: "/app/data/tts-downloads"
      TTS_PREVIEW_DIR: "/app/data/tts-previews"
      # Paper Playground: where notebook datasets are cached (the
      # playground_data volume below) and how much each playground may hold.
      PLAYGROUND_DATA_DIR: "/app/playground-data"
      PLAYGROUND_DATA_MAX_BYTES: "${PLAYGROUND_DATA_MAX_BYTES:-1000000000}"
      PLAYGROUND_NOTEBOOK_MAX_BYTES: "${PLAYGROUND_NOTEBOOK_MAX_BYTES:-25000000}"
      # Obsidian vault. The process writes /vault. The host folder defaults
      # to ~/NLP-Vault (VAULT_HOST_DIR overrides it) so the captain can open
      # that directory in Obsidian. VAULT_DIR in .env is the host path for a
      # process that is not in this container; here it is the mount point.
      # The scheduler refreshes the vault only when VAULT_EXPORT_ENABLED=true.
      VAULT_DIR: /vault
      VAULT_EXPORT_ENABLED: ${VAULT_EXPORT_ENABLED:-false}
      # The playground runner, reached over the internal-only `playground`
      # network below. It publishes no host port.
      PLAYGROUND_RUNNER_URL: "${PLAYGROUND_RUNNER_URL:-http://playground-runner:8765}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # `default` must be listed now that a second network is: a service with a
      # `networks:` key joins only the networks it names.
      - default
      - playground
    volumes:
      # Captain's voice reference library — read-only; the app must not modify it.
      - /home/gabo/Desktop/indexttsvoices:/voices:ro
      # Uploaded PDFs are retained, not temporary: papers.url_pdf stores
      # file:///app/data/uploads/<hash>.pdf and podcast generation reads the
      # paper body back out of it. A named volume (same pattern as pg_data,
      # not a bind mount into the repo) so uploads survive `docker compose
      # down` and image rebuilds, and never end up staged in git.
      - uploads_data:/app/data
      # New recordings are visible on the host in ~/NLP-Podcasts. The old
      # uploads volume is mounted read-only separately for playback of files
      # written before this directory existed.
      - uploads_data:/legacy-data:ro
      - type: bind
        source: "${NLP_PODCASTS_HOST_DIR:-${HOME}/NLP-Podcasts}"
        target: /podcasts
        bind:
          create_host_path: true
      # Paper Playground datasets, downloaded at notebook import
      # (docs/PLAYGROUND.md). Read-write here; the sandbox mounts the same
      # volume read-only at /data. Its own volume, not a folder of uploads_data,
      # so the sandbox can never see the retained PDFs.
      - playground_data:/app/playground-data
      # Same folder the scheduler writes when VAULT_EXPORT_ENABLED=true, so
      # `vault export` from this container and the nightly refresh cannot
      # diverge. `./workstation up` creates the host directory as the user
      # first. create_host_path: false stops Docker from making a missing
      # folder root-owned when compose is started on its own.
      - type: bind
        source: "${VAULT_HOST_DIR:-${HOME}/NLP-Vault}"
        target: /vault
        bind:
          create_host_path: false
    depends_on:
      # Map form (not the list form used before) so a condition can be set.
      # Search reads the local Qdrant, so wait until its healthcheck passes.
      qdrant:
        condition: service_healthy
      postgrest:
        condition: service_started
      podcast-audio-dir-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Compose creates the host directory, then this one-shot fixes its directory
  # owner for the non-root appuser. It only changes the directory itself; any
  # existing episode files keep their original ownership and contents.
  podcast-audio-dir-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /podcasts && chown 1000:1000 /podcasts"]
    volumes:
      - type: bind
        source: "${NLP_PODCASTS_HOST_DIR:-${HOME}/NLP-Podcasts}"
        target: /podcasts
        bind:
          create_host_path: true
    healthcheck:
      disable: true
    restart: "no"

  # ============================================
  # Daily-run scheduler
  # Replaces the schedule trigger on .github/workflows/daily.yml, which cannot
  # reach this database from GitHub's runners. Same image as webui, different
  # command — no duplicated code, and a rebuild moves both together.
  #
  # Deliberately its own service rather than a thread inside webui: a webui
  # crash or restart must not silently stop the daily learning run, and this way
  # its logs are its own (`docker compose logs scheduler`).
  # ============================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_scheduler
    command: ["python", "-m", "nlp_pillars.scheduler"]
    env_file:
      - .env
    environment:
      # Same three database overrides as webui, and for the same reasons — see
      # the long comment on that service. The scheduler drives the pipeline
      # through nlp_pillars/db.py, which reads SUPABASE_URL only.
      #
      # A scheduled ingest projects into the same local Qdrant webui reads.
      SEARXNG_URL: "http://searxng:8080"
      POSTGREST_URL: "http://postgrest:3000"
      SUPABASE_URL: "http://postgrest:3000"
      # Same local server and optional cloud target as webui. Hardcoded URL so
      # the two containers cannot diverge onto whatever QDRANT_URL .env still
      # holds from the old cloud endpoint.
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: ""
      QDRANT_CLOUD_URL: "${QDRANT_CLOUD_URL:-}"
      QDRANT_CLOUD_API_KEY: "${QDRANT_CLOUD_API_KEY:-}"
      # Same key webui needs: a scheduled run generates the same notes,
      # lessons and quiz cards.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env — generation runs on Claude}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env — DeepSeek Ground Pack extraction}"
      # Same embedding cache as webui. A scheduled ingest writes chunk
      # embeddings, and the weights have to be the ones webui already downloaded.
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-local}"
      EMBEDDING_CACHE_DIR: /app/data/embedding-models
      SUPABASE_KEY: "${LOCAL_API_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoid2ViX2Fub24ifQ.jZ5fef9pol5Rqbrl64ZhHMvvAKmT91b_ZtsOYLyEbxM}"
      # Same vault mount as webui. Off unless VAULT_EXPORT_ENABLED=true,
      # in which case the daily run rewrites /vault when it finishes.
      VAULT_DIR: /vault
      VAULT_EXPORT_ENABLED: ${VAULT_EXPORT_ENABLED:-false}
    volumes:
      # A scheduled run can ingest PDFs, so it needs the same retained uploads
      # volume webui writes to — not a second, divergent copy.
      - uploads_data:/app/data
      - type: bind
        source: "${VAULT_HOST_DIR:-${HOME}/NLP-Vault}"
        target: /vault
        bind:
          create_host_path: false
    depends_on:
      qdrant:
        condition: service_healthy
      postgrest:
        condition: service_started
      searxng:
        condition: service_started
    # The Dockerfile's HEALTHCHECK curls http://localhost:8000/health, which only
    # exists in the webui container. Inherited here it can never pass, so this
    # service would sit permanently "unhealthy" while working perfectly. There is
    # nothing useful to probe instead — the scheduler *is* the container's main
    # process, so if it dies the container exits and `restart: on-failure` reacts.
    healthcheck:
      disable: true
    # NOT `unless-stopped`: with SCHEDULE_ENABLED=false the process exits 0 on
    # purpose, and `unless-stopped` would restart it forever. `on-failure`
    # leaves the disabled state visible as "Exited (0)" in `docker compose ps`
    # while still restarting a scheduler that genuinely crashed.
    restart: on-failure

  # ============================================
  # Playground runner (locked-down Python for paper playgrounds)
  #
  # Runs notebook code in one Jupyter kernel per session. It holds no keys and
  # no app code (its own image, built from docker/playground-runner/), and
  # every line of the lockdown below is load-bearing — see
  # docs/PLAYGROUND_RUNNER.md before loosening any of it. Idle it is one small
  # uvicorn process; a kernel starts only when a session is created.
  # ============================================
  playground-runner:
    build:
      context: ./docker/playground-runner
    image: nlp-playground-runner:local
    container_name: nlp_playground_runner
    # No `ports:`. Only webui can reach it, over the internal network.
    networks:
      - playground
    read_only: true
    tmpfs:
      # Writable scratch on a read-only root. tmpfs is RAM and counts toward
      # the memory limit below.
      - /tmp:size=${PLAYGROUND_TMP_SIZE:-512m},mode=1777
      - /work:size=${PLAYGROUND_WORK_SIZE:-2g},uid=10001,gid=10001,mode=0700
    # joblib (scikit-learn n_jobs) memory-maps large arrays into /dev/shm;
    # Docker's 64 MB default is smaller than one 1M-row float matrix.
    shm_size: "${PLAYGROUND_SHM_SIZE:-1g}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${PLAYGROUND_RUNNER_MEMORY:-6g}"
    # Same as mem_limit: no swap on top of it.
    memswap_limit: "${PLAYGROUND_RUNNER_MEMORY:-6g}"
    cpus: "${PLAYGROUND_RUNNER_CPUS:-4}"
    pids_limit: ${PLAYGROUND_RUNNER_PIDS:-512}
    environment:
      PLAYGROUND_EXEC_TIMEOUT_S: "${PLAYGROUND_EXEC_TIMEOUT_S:-180}"
      PLAYGROUND_MAX_EXEC_TIMEOUT_S: "${PLAYGROUND_MAX_EXEC_TIMEOUT_S:-900}"
      PLAYGROUND_MAX_OUTPUT_BYTES: "${PLAYGROUND_MAX_OUTPUT_BYTES:-2000000}"
      PLAYGROUND_MAX_SESSIONS: "${PLAYGROUND_MAX_SESSIONS:-3}"
      PLAYGROUND_IDLE_TIMEOUT_S: "${PLAYGROUND_IDLE_TIMEOUT_S:-1800}"
      # Keep BLAS/OpenMP thread pools inside the CPU limit.
      OMP_NUM_THREADS: "${PLAYGROUND_RUNNER_CPUS:-4}"
      OPENBLAS_NUM_THREADS: "${PLAYGROUND_RUNNER_CPUS:-4}"
      MKL_NUM_THREADS: "${PLAYGROUND_RUNNER_CPUS:-4}"
    volumes:
      # Cached playground datasets, written by the web app (PR 1 of the
      # playground work). Read-only here.
      - playground_data:/data:ro
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  # Internal-only: Docker gives it no route off the host, so the runner has no
  # egress. webui joins it to reach the runner. Not given a fixed name, so a
  # second stack (-p <project>) gets its own.
  playground:
    internal: true

# ============================================
# Named Volumes (Docker-managed)
# ============================================
volumes:
  # Playground dataset cache: /data/<playground_id>/ plus manifest.json.
  # Re-downloadable, unlike pg_data and uploads_data, but still named so a
  # rebuild or `down` keeps it.
  playground_data:
    name: nlp_playground_data
  # Local Qdrant storage. Shared with any other worktree running this compose
  # file. Never remove it to "clean up". A second worktree must override the
  # volume name or it attaches to this one.
  qdrant_data:
    name: nlp_qdrant_data
  # Application database. Named so `docker compose down` (without -v) keeps it.
  pg_data:
    name: nlp_pg_data
  # Retained uploaded PDFs. Same reasoning as pg_data: this is real data, not a
  # cache — for a file-uploaded paper it is the only copy of the PDF, and
  # papers.url_pdf points into it.
  uploads_data:
    name: nlp_uploads
