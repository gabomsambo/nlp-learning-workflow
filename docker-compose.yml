services:
  # ============================================
  # Postgres (Self-hosted application database)
  # Replaces the hosted Supabase project, whose host no longer resolves.
  # ============================================
  db:
    # Pinned to a major version on purpose. `latest` would let a rebuild move
    # the server major underneath an existing data volume, which Postgres
    # refuses to start against.
    image: postgres:16-alpine
    container_name: nlp_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nlp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nlp_local_dev}"
      POSTGRES_DB: "${POSTGRES_DB:-nlp}"
      # Consumed by db/init/01-roles.sh to create the PostgREST login role.
      AUTHENTICATOR_PASSWORD: "${AUTHENTICATOR_PASSWORD:-authenticator_local_dev}"
    volumes:
      # Named volume, NOT a bind mount into the repo: data must survive
      # `docker compose down` and must never end up staged in git.
      - pg_data:/var/lib/postgresql/data
      # Init scripts run once, only when the data directory is empty, in
      # alphabetical order. 01 creates roles, 02 is the repo's schema.sql
      # mounted in place (mounted rather than copied so there is exactly one
      # authoritative schema file), 03 grants on the tables 02 created.
      - ./db/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/init/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    ports:
      # Loopback only. The auth model (see db/init/01-roles.sh) assumes this
      # port is not reachable from the network.
      #
      # 5434 on the host, not 5432. This machine already has TWO postgres
      # servers on the usual ports: an unrelated Docker project
      # (NaveeraTech/naveera-api) publishes postgres:16 on 5432, and a native
      # host Postgres listens on 5433. Two listeners cannot share a host port, so
      # `up -d` fails outright with "address already in use" rather than
      # degrading.
      #
      # Diagnosing this needs a real bind test, not `lsof`: plain `lsof -iTCP`
      # run as your own user does NOT show the 5433 server (it belongs to another
      # user) and reports the port free. `netstat -an | grep 5433` and a
      # throwaway `socket.bind()` both show it correctly.
      #
      # Nothing inside this stack is affected: postgrest reaches the database as
      # `db:5432` over the compose network and never touches the published port.
      # Host-side tools do, so connect with `psql -h 127.0.0.1 -p 5434`. The
      # container-side 5432 must stay as it is — that is the port Postgres
      # actually listens on.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlp} -d ${POSTGRES_DB:-nlp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # PostgREST (REST interface the app already speaks)
  # nlp_pillars/db.py is a hand-written PostgREST client, so this needs no
  # application code change — only the URL changes.
  # ============================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: nlp_postgrest
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator_local_dev}@db:5432/${POSTGRES_DB:-nlp}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_SERVER_PORT: "3000"
      # A JWT secret IS required here, and this was verified the hard way.
      # Both database clients send `Authorization: Bearer <SUPABASE_KEY>` on
      # every request and neither can be told not to (nlp_pillars/db.py's
      # get_client() raises if SUPABASE_KEY is empty, and PostgRESTClient sets
      # the header unconditionally). With no secret configured, PostgREST does
      # NOT ignore that token — it fails the whole request with
      # HTTP 500 PGRST300 "Server lacks JWT secret".
      #
      # So the stack supplies a secret, and hands the app a matching token
      # (LOCAL_API_TOKEN on the webui service below) whose only claim is
      # role=web_anon. Loopback-only single-user tool, so the default below is
      # a committed placeholder, exactly like POSTGRES_PASSWORD. Override both
      # it and LOCAL_API_TOKEN in .env if this is ever exposed beyond
      # localhost — they must be changed together, since the token is signed
      # with this secret.
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:-nlp-local-dev-jwt-secret-change-me-please-32}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Qdrant Vector Database (Local) — DEFINED BUT NOT STARTED BY DEFAULT
  #
  # As of 2026-08-29 the app talks to Qdrant Cloud again (see the QDRANT block
  # on `webui`), so this service has no consumer. It is kept rather than
  # deleted because it is the offline option and because `nlp_qdrant_data`
  # still holds vectors from earlier local runs.
  #
  # The `profiles:` key is what makes "unused" structurally true instead of
  # merely documented: a service with a profile is skipped by a plain
  # `docker compose up -d`, so an idle container cannot sit there holding
  # 6333/6334 and looking like the thing the app is using. Nothing silently
  # depends on it — the `depends_on: qdrant` entries on webui and scheduler
  # were removed in the same change.
  #
  # To run it (offline work, or inspecting the old local vectors):
  #     docker compose --profile local-vectors up -d qdrant
  # Pointing the app back at it means changing QDRANT_URL/QDRANT_API_KEY in
  # .env for BOTH webui and scheduler and restoring both depends_on entries.
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nlp_qdrant
    profiles: ["local-vectors"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ============================================
  # SearXNG Search Engine (Local)
  # ============================================
  searxng:
    image: searxng/searxng:latest
    container_name: nlp_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng_config:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=nlp-workflow-secret-key
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
    restart: unless-stopped

  # ============================================
  # NLP Workflow WebUI (FastAPI)
  # Reads and writes through the self-hosted postgrest service above.
  # ============================================
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_webui
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides for Docker networking. Values set here beat anything in the
      # env_file above, which matters for POSTGREST_URL in particular.
      #
      # QDRANT: back on Qdrant Cloud as of 2026-08-29. This reverses the
      # 2026-08-16 note that used to live here, which said the cloud cluster
      # "no longer exists" and hardcoded `http://qdrant:6333` on both services.
      # That was wrong: the free-tier cluster had been SUSPENDED for inactivity,
      # not deleted. Unsuspending it took 20 seconds and the `nlp_pillars`
      # collection came back intact — 170 points, status green, pillar_id
      # payload index present.
      #
      # A suspended cluster does not fail like a dead host, which is why it read
      # as gone: DNS still resolves, the regional ingress still terminates TLS,
      # and EVERY path — `/`, `/healthz`, `/collections` alike — answers a
      # plain-text `404 page not found`. A live cluster answers `/` with a JSON
      # banner. Read that 404 as "no cluster routed behind this UUID", never as
      # "wrong endpoint".
      #
      # These are interpolated from .env rather than hardcoded, and that is the
      # point: `webui` and `scheduler` share one Qdrant collection and must
      # never disagree about which server holds it. One value in one file makes
      # them identical by construction; two hardcoded copies only look identical
      # until someone edits one of them. The API key is a live credential and
      # must never be written into this file.
      #
      # `:?` (required-variable) rather than a default, because the failure mode
      # of an unset QDRANT_URL is silent: nlp_pillars/vectors.py:45-47 logs a
      # WARNING and disables vector operations, so a daily run would complete,
      # report success, and write no embeddings at all. Failing at
      # `docker compose up` is the loud version of that.
      QDRANT_URL: "${QDRANT_URL:?set QDRANT_URL in .env — the Qdrant Cloud cluster endpoint}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env — the Qdrant Cloud API key}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env — DeepSeek Ground Pack extraction}"
      #
      # The three database variables below ARE overridden, and all three are
      # needed. Nothing is deleted from .env — these only shadow it for this
      # container, so SUPABASE_URL / SUPABASE_KEY stay on disk and the old
      # project remains reachable if its data is ever recovered.
      #
      # There are TWO database clients and they resolve the URL differently:
      #   - webui/services/postgrest_client.py:54 reads
      #     POSTGREST_URL -> SUPABASE_URL -> http://localhost:3000
      #   - nlp_pillars/db.py's get_client() reads SUPABASE_URL ONLY. It has
      #     no POSTGREST_URL fallback, and it is the client behind
      #     /api/pillars/ and the rest of the pipeline.
      # So POSTGREST_URL alone is NOT sufficient — SUPABASE_URL must be
      # overridden too, or half the app keeps dialling the dead host. (.env
      # still contains stale values for both.)
      #
      # SUPABASE_KEY is overridden because it is sent as an
      # `Authorization: Bearer` token on every request and cannot be disabled:
      # get_client() raises outright if it is empty. The stale Supabase JWT
      # cannot be verified by this PostgREST, so a locally-signed web_anon
      # token replaces it. See PGRST_JWT_SECRET on the postgrest service.
      SEARXNG_URL: "http://searxng:8080"
      POSTGREST_URL: "http://postgrest:3000"
      SUPABASE_URL: "http://postgrest:3000"
      SUPABASE_KEY: "${LOCAL_API_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoid2ViX2Fub24ifQ.jZ5fef9pol5Rqbrl64ZhHMvvAKmT91b_ZtsOYLyEbxM}"
    volumes:
      # Uploaded PDFs are retained, not temporary: papers.url_pdf stores
      # file:///app/data/uploads/<hash>.pdf and podcast generation reads the
      # paper body back out of it. A named volume (same pattern as pg_data,
      # not a bind mount into the repo) so uploads survive `docker compose
      # down` and image rebuilds, and never end up staged in git.
      - uploads_data:/app/data
    depends_on:
      # Map form (not the list form used before) so postgrest can carry a
      # condition. `qdrant` is deliberately NOT listed: the app talks to Qdrant
      # Cloud (see the QDRANT block above), so a depends_on here would start a
      # container nothing reads and imply a dependency that does not exist.
      postgrest:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # Daily-run scheduler
  # Replaces the schedule trigger on .github/workflows/daily.yml, which cannot
  # reach this database from GitHub's runners. Same image as webui, different
  # command — no duplicated code, and a rebuild moves both together.
  #
  # Deliberately its own service rather than a thread inside webui: a webui
  # crash or restart must not silently stop the daily learning run, and this way
  # its logs are its own (`docker compose logs scheduler`).
  # ============================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_scheduler
    command: ["python", "-m", "nlp_pillars.scheduler"]
    env_file:
      - .env
    environment:
      # Same three database overrides as webui, and for the same reasons — see
      # the long comment on that service. The scheduler drives the pipeline
      # through nlp_pillars/db.py, which reads SUPABASE_URL only.
      #
      # The Qdrant override is here too, and is not optional: a daily run ingests
      # papers, and ingest writes vectors. Without it the scheduler would keep
      # dialling the suspended cloud cluster and every run would lose its
      # embeddings while the webui quietly used the local one. Whenever one of
      # these two services changes which Qdrant it talks to, the other must
      # change with it — they share a collection.
      SEARXNG_URL: "http://searxng:8080"
      POSTGREST_URL: "http://postgrest:3000"
      SUPABASE_URL: "http://postgrest:3000"
      # Qdrant Cloud, from the same two .env values webui uses — see the long
      # comment on that service. This is not a convenience: the two containers
      # share ONE collection, so if they ever resolve QDRANT_URL differently the
      # scheduler's nightly embeddings land somewhere the UI never reads.
      # Sourcing both from one .env entry is what makes that impossible.
      QDRANT_URL: "${QDRANT_URL:?set QDRANT_URL in .env — the Qdrant Cloud cluster endpoint}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env — the Qdrant Cloud API key}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env — DeepSeek Ground Pack extraction}"
      SUPABASE_KEY: "${LOCAL_API_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoid2ViX2Fub24ifQ.jZ5fef9pol5Rqbrl64ZhHMvvAKmT91b_ZtsOYLyEbxM}"
    volumes:
      # A scheduled run can ingest PDFs, so it needs the same retained uploads
      # volume webui writes to — not a second, divergent copy.
      - uploads_data:/app/data
    depends_on:
      postgrest:
        condition: service_started
      searxng:
        condition: service_started
      # No `qdrant` entry, same reason as on webui: vectors go to Qdrant Cloud,
      # which is not a service in this file and cannot be waited on here.
    # The Dockerfile's HEALTHCHECK curls http://localhost:8000/health, which only
    # exists in the webui container. Inherited here it can never pass, so this
    # service would sit permanently "unhealthy" while working perfectly. There is
    # nothing useful to probe instead — the scheduler *is* the container's main
    # process, so if it dies the container exits and `restart: on-failure` reacts.
    healthcheck:
      disable: true
    # NOT `unless-stopped`: with SCHEDULE_ENABLED=false the process exits 0 on
    # purpose, and `unless-stopped` would restart it forever. `on-failure`
    # leaves the disabled state visible as "Exited (0)" in `docker compose ps`
    # while still restarting a scheduler that genuinely crashed.
    restart: on-failure

# ============================================
# Named Volumes (Docker-managed)
# ============================================
volumes:
  # Storage for the `local-vectors` profile's qdrant service only — the app
  # writes to Qdrant Cloud. Kept because it still holds vectors from the period
  # when the app did use local Qdrant, and because it is shared with any other
  # worktree running this compose file. Never remove it to "clean up".
  qdrant_data:
    name: nlp_qdrant_data
  # Application database. Named so `docker compose down` (without -v) keeps it.
  pg_data:
    name: nlp_pg_data
  # Retained uploaded PDFs. Same reasoning as pg_data: this is real data, not a
  # cache — for a file-uploaded paper it is the only copy of the PDF, and
  # papers.url_pdf points into it.
  uploads_data:
    name: nlp_uploads
