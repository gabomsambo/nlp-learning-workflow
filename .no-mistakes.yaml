# no-mistakes gate configuration for nlp-learning-workflow.
#
# Read ONLY from the default branch at a pinned SHA, never from a pushed
# branch, so a feature branch cannot change what executes here.

# Pipeline agent for review/test/document.
#
# This repo previously had no `agent:` key, so it fell through to the global
# `agent: auto` in ~/.no-mistakes/config.yaml -- and auto probes CLAUDE first.
# Every pipeline run here was silently spending Claude plan quota.
#
# The list is an AVAILABILITY fallback resolved once at run startup, not
# quota-aware routing. The FIRST available entry becomes the primary agent for
# the whole run, so order is the only dial here.
#
# opencode leads as of 2026-09-05. It runs on OpenCode's free tier with no
# credential at all (verified: `opencode run` answers on the free big-pickle
# model, exit 0), so every run it takes is Claude and Codex quota preserved.
#
# Two known weaknesses, accepted deliberately -- codex sits directly behind it
# and claude behind that, so the gate never fails for want of a runnable agent:
#
#   1. Structured output. codex has native structured-output parsing; opencode
#      goes through no-mistakes' "prompt-only structured output fallback",
#      which validates JSON out of the final assistant text. That is the
#      weaker path for the review step's findings, and review is where 42 of
#      46 lifetime fixes on these repos came from.
#   2. No session reuse. `session_reuse` is supported for claude and codex
#      only; other agents run cold, so opencode re-reads context on every
#      review round rather than keeping a durable session.
#
# This repo runs [direct-PR +yolo], so firstmate merges green PRs without a
# human read. The deterministic `test` gate below and CI are the backstops.
# To revert, delete this whole `agent:` key and it falls back to global auto.
agent: [opencode, codex, claude]

commands:
  # The two cheap, stdlib-only checks from .github/workflows/tests.yml, which
  # both finish in well under a second and need no dependency install. The
  # pipeline runs in a fresh worktree with no environment, so these are the
  # only gates that are honest AND affordable here.
  #
  # check_bare_slugs.py is not tidiness: 73 unquoted pillar slugs survived
  # thirteen merged PRs because nothing could collect those test files. See
  # "The test suite runs in CI, and it is green" in AGENTS.md.
  #
  # node is not on every PATH on this machine (it lives in ~/.local/bin), so a
  # missing node SKIPS the JS helpers rather than failing the step -- but a
  # real JS test failure still fails, and is never swallowed.
  test: |
    python3 scripts/check_bare_slugs.py || exit 1
    if command -v node >/dev/null 2>&1; then
      node --test tests/js/*.test.js || exit 1
    else
      echo "node not found on PATH; skipped JS helper tests"
    fi

  # The full pytest suite is deliberately NOT wired in. It is hermetic and
  # green (353/353 as of PR #16) and it is the right gate -- but running it
  # needs requirements.lock.txt, which pulls torch and is several GB. CI has a
  # pip cache for that; a fresh pipeline worktree does not, so the install
  # would cost far more per run than the gate is worth. CI owns it on every PR.

  # lint is deliberately UNSET. `ruff check .` reports 2,338 pre-existing
  # errors against the [tool.ruff] select list in pyproject.toml (the D
  # docstring rules alone flood it), measured 2026-08-29. Wiring it in would
  # fail the lint step on every run and burn three auto-fix rounds on
  # pre-existing debt unrelated to the change.
  #
  # Before setting any command here, run it on a clean checkout of the default
  # branch and confirm it exits 0. A command that fails on main turns every
  # run into three wasted fix rounds.

ignore_patterns:
  - requirements.lock.txt
