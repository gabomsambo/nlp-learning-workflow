{% extends 'base.html' %}
{% block content %}
<h2>Lessons{% if pillar %} ({{ pillar }}){% endif %}</h2>

<form method="get">
  <label>
    Pillar
    <select name="pillar">
      <option value="">All</option>
      {% for p in pillars %}
      <option value="{{ p.id }}" {% if pillar==p.id %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Filter</button>
  <a role="button" href="/lessons/">Reset</a>
  <a role="button" class="secondary" href="/papers/">Browse Papers</a>
</form>

<table>
  <thead>
    <tr><th>Paper</th><th>TL;DR</th><th>Difficulty</th><th>Time</th><th>Pillar</th></tr>
  </thead>
  <tbody>
  {% for l in lessons %}
    <tr>
      <td><small>{{ l.paper_id }}</small></td>
      <td>{{ l.tl_dr }}</td>
      <td>{{ l.difficulty }}</td>
      <td>{{ l.estimated_time }}m</td>
      <td>{{ l.pillar_id }}</td>
    </tr>
  {% endfor %}
  </tbody>
  </table>
{% endblock %}
