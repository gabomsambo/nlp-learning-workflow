# The reader. Deploy by hand with the pinned wrangler (see README.md); there is
# no CI deploy. Personal account only.
name = "nlp-reader"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# A *.workers.dev address would be a way around Access, so there is none.
workers_dev = false
preview_urls = false

routes = [{ pattern = "read.gabrielsambo.com", custom_domain = true }]

[observability]
enabled = true

# Static files. The Worker runs first, so the Access check covers them too.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# The published bundle.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "nlp-reader-docs"

# The phone's review events, the one thing the reader can write (src/reviews.js).
# It is a mailbox the computer empties, not a source of truth. Apply the table with
#   wrangler d1 migrations apply nlp-reader-reviews --remote
# These three bindings (DOCS, REVIEWS, ASSETS) are all the Worker has.
[[d1_databases]]
binding = "REVIEWS"
database_name = "nlp-reader-reviews"
database_id = "764ed429-9d7b-490a-9379-8636dc40818b"
migrations_dir = "migrations"

[vars]
TEAM_DOMAIN = "soft-wave-31cb.cloudflareaccess.com"
# The Access application's AUD tag for read.gabrielsambo.com (filled in once it exists).
ACCESS_AUD = "b75dc0eabb1ef8c7bbe40d198c39bc7bc6062e1dd5cfa96018d9091961a2a667"
# The ingest Access application (read.gabrielsambo.com/ingest, Service Auth only).
INGEST_AUD = "9a484e80cf3ebe0d1e294444b71fd42bfc878509aecb74a21562d4704b26cb44"
# Client id of the one service token the publisher uses. An id, not a secret.
INGEST_SERVICE_TOKENS = "b4db51bb31d516fc7876f05972051c38.access"
# The bucket shares the account's 10 GB free tier with other projects, so stop well short of it.
INGEST_MAX_BYTES = "5000000000"
# Secrets, set with `wrangler secret put` and never committed:
#   ALLOWED_EMAILS          comma-separated; required, nobody is let in without it
#   ALLOWED_SERVICE_TOKENS  optional; service-token client ids allowed to read
