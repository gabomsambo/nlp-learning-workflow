# Web UI package for NLPWorkflow.
# Provides FastAPI app, routes, templates, and static assets to browse data
# from PostgREST and trigger the existing pipeline.
[tool.poetry]
name = "nlp-learning-workflow"
version = "0.1.0"
description = "Automated NLP research learning system with 5 independent pillars"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "nlp_pillars"}]

[tool.poetry.dependencies]
# 3.12 is the real floor: atomic-agents requires >= 3.12, and the Docker
# image runs 3.12. This said ^3.11 for a while, which made the documented
# `uv venv --python 3.11` recipe fail at install time.
python = "^3.12"
atomic-agents = "^2.0.0"
instructor = "^1.0.0"
pydantic = "^2.0.0"
openai = "^1.0.0"
anthropic = "^0.25.0"
groq = "^0.5.0"
supabase = "^2.0.0"
qdrant-client = "^1.8.0"
pypdf = "^4.0.0"
# 4.x, not the ^0.1.0 this used to declare: chunk_text() passes `overlap=`,
# which only exists from semchunk 3.x, and requirements.txt pins 4.1.1.
semchunk = "^4.1.1"
# Chunk sizes are counted with tiktoken's cl100k_base so they match what the
# embedding model sees (nlp_pillars/tools/pdf_loader.py::_get_token_counter).
tiktoken = "^0.13.0"
layoutparser = "^0.3.4"
torch = "^2.0.0"
torchvision = "^0.15.0"
pdf2image = "^1.16.0"
pytesseract = "^0.3.10"
Pillow = "^10.0.0"
typer = "^0.9.0"
rich = "^13.0.0"
fsrs = "^6.0.0"
httpx = "^0.25.0"
arxiv = "^2.1.0"
python-dotenv = "^1.0.0"
structlog = "^24.0.0"
tenacity = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.5.0"
pre-commit = "^3.5.0"

[tool.poetry.scripts]
nlp-pillars = "nlp_pillars.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "C90", "D"]
ignore = ["D100", "D104"]  # Missing docstring in public module/package

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=nlp_pillars --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["nlp_pillars"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
