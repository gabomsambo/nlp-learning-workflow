use_default_settings: true

general:
  instance_name: "NLP Workflow Search"

search:
  default_lang: "en"
  # SearXNG defaults to HTML only, and answers ?format=json with 403.
  # nlp_pillars/tools/searxng_tool.py asks for JSON, so the API format has to
  # be enabled explicitly here or paper discovery via SearXNG returns nothing.
  formats:
    - html
    - json

server:
  secret_key: "nlp-workflow-secret-key-change-this-in-production"
  public_instance: true
  limiter: false

engines:
  - name: arxiv
    disabled: false
  - name: duckduckgo  
    disabled: false
